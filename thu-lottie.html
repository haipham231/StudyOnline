<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Xem thử câu cá</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@lottiefiles/dotlottie-wc@0.6.2/dist/dotlottie-wc.js"></script>
<style>body{background:#e3f1ff;color:#2b2f55;font:12px system-ui;margin:0;padding:8px}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.o{border:1px solid #ccd;border-radius:10px;padding:4px;text-align:center;background:#fff}</style>
</head><body><div class="g" id="g"></div>
<script>
  var ds = ['cau-ca-1','cau-ca-2','cau-ca-3','ca-1','ca-2','ca-map-1','ca-map-2','ca-map-3','xo-1','xo-2'];
  document.getElementById('g').innerHTML = ds.map(function (t) {
    return '<div class="o"><dotlottie-wc src="assets/lottie/thu/' + t +
      '.lottie" autoplay loop style="width:110px;height:110px;margin:auto"></dotlottie-wc><div><b>' + t + '</b></div></div>';
  }).join('');
</script></body></html>
