<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

<body>
<header class="topbar">
  <a class="back" href="../index.html">← Quay lại</a>
  <h1>🍼 Bé tập nói</h1>
</header>

<div class="cong-tac">
  <label class="song-ngu">
    <input type="checkbox" id="songngu"> <span>🇬🇧 Hiện thêm tiếng Anh</span>
  </label>
</div>

<main id="quiz" class="quiz"></main>

<script src="../../js/o-tra-loi.js"></script>
<script src="../../js/quiz.js"></script>
<script src="../../js/tieng-viet-mam-non.js"></script>
<script>
  var M = TiengVietMN;

  var o = document.getElementById('songngu');
  o.checked = M.songNgu();
  o.addEventListener('change', function () { M.datSongNgu(o.checked); location.reload(); });

  Quiz.init({
    id: 'mn-tv-be-2-tuoi',
    total: 6,
    kids: true,
    speak: true,
    levels: [
      { name: 'Con vật quen thuộc', hint: 'Chọn 1 trong 2', gen: function () { return M.ngheVaChon('con vật', 2); } },
      { name: 'Đồ ăn', gen: function () { return M.ngheVaChon('đồ ăn', 2); } },
      { name: 'Cơ thể của bé', gen: function () { return M.ngheVaChon('cơ thể', 2); } },
      { name: 'Trộn tất cả', gen: function () { return M.ngheVaChon(null, 2); } }
    ]
  });
</script>
</body>
</html>
