<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Con vật ăn gì — Mầm non</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>🍽️</text></svg>">
<script type="module" src="https://cdn.jsdelivr.net/npm/@lottiefiles/dotlottie-wc@0.6.2/dist/dotlottie-wc.js"></script>
</head>
<body>
<header class="topbar">
  <a class="back" href="../index.html">← Quay lại</a>
  <h1>🍽️ Con vật ăn gì</h1>
</header>

<main id="quiz" class="quiz"></main>

<script src="../../js/o-tra-loi.js"></script>
<script src="../../js/hinh-ve.js"></script>
<script src="../../js/hoat-hinh.js"></script>
<script src="../../js/quiz.js"></script>
<script src="../../js/con-vat.js"></script>
<script src="../../js/cat-canh.js"></script>
<script>
  function cauHoi(soLuaChon) {
    var con = Quiz.pick(ConVat.DS);
    var sai = ConVat.nhieu(ConVat.DS, soLuaChon - 1, function (c) { return c.an.e; }, con.an.e);

    var dung = ConVat.nut(con.an.e, con.an.ten);
    var luaChon = Quiz.shuffle([dung].concat(sai.map(function (c) {
      return ConVat.nut(c.an.e, c.an.ten);
    })));

    return {
      prompt: Quiz.pick(['Bạn nhỏ ơi, ', '', 'Đố bé, ']) + con.ten + ' thích ăn gì?',
      speak: con.ten + ' thích ăn gì?',
      art: ConVat.veCon(con, 180),
      answer: dung,
      choices: luaChon,
      cols: soLuaChon === 2 ? 2 : 3
    };
  }

  /* Hai cắt cảnh biến tám câu hỏi thành một câu chuyện nhỏ: các bạn thú đói
     bụng → bé cho các bạn ăn → các bạn no căng bụng. Có tranh rồi thì điền
     đường dẫn vào hinh, chưa có thì dùng mấy hình dán trong kho xếp hàng. */
  var CANH = {
    moDau: { hinh: null, hinhTam: ['dan/con-vat/tho', 'dan/con-vat/khi', 'dan/con-vat/cho', 'dan/con-vat/meo'],
             nen: 'linear-gradient(180deg,#fff3dd,#ffe6ef)',
             loi: 'Các bạn thú đói bụng rồi! Bé cho các bạn ăn nhé.' },
    ketThuc: { hinh: null, hinhTam: ['dan/con-vat/tho', 'dan/con-vat/khi', 'dan/con-vat/cho', 'dan/con-vat/meo'],
               nen: 'linear-gradient(180deg,#e3fbe7,#fff3dd)' }
  };

  Quiz.init({
    id: 'mn-con-vat-an-gi',
    total: 8,
    kids: true,
    khongChu: true,
    speak: true,
    moDau: function (goc, tiepTuc) {
      CatCanh.hien(goc, {
        hinh: CANH.moDau.hinh, hinhTam: CANH.moDau.hinhTam, nen: CANH.moDau.nen,
        loi: CANH.moDau.loi,
        cacNut: [{ chu: 'Cho các bạn ăn ▶', bam: tiepTuc }]
      });
    },
    ketThuc: function (goc, kq, tiepTuc) {
      CatCanh.hien(goc, {
        hinh: CANH.ketThuc.hinh, hinhTam: CANH.ketThuc.hinhTam, nen: CANH.ketThuc.nen,
        loi: 'Các bạn thú no căng bụng rồi! Cảm ơn bé nhé.',
        cacNut: [{ chu: 'Xem bé được mấy sao ▶', bam: tiepTuc }]
      });
    },
    levels: [
      { name: 'Dễ', hint: 'Chọn 1 trong 2 món', gen: function () { return cauHoi(2); } },
      { name: 'Khó hơn', hint: 'Chọn 1 trong 3 món', gen: function () { return cauHoi(3); } }
    ]
  });
</script>
</body>
</html>
