<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Con gì kêu — Mầm non</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>🔊</text></svg>">
</head>
<body>
<header class="topbar">
  <a class="back" href="../index.html">← Quay lại</a>
  <h1>🔊 Con gì kêu</h1>
</header>

<main id="quiz" class="quiz"></main>

<script src="../../js/o-tra-loi.js"></script>
<script src="../../js/quiz.js"></script>
<script src="../../js/con-vat.js"></script>
<script>
  function cauHoi(soLuaChon) {
    var con = Quiz.pick(ConVat.coTiengKeu);
    var sai = ConVat.nhieu(ConVat.DS, soLuaChon - 1, function (c) { return c.e; }, con.e);

    var dung = ConVat.nut(con.e, con.ten);
    var luaChon = Quiz.shuffle([dung].concat(sai.map(function (c) {
      return ConVat.nut(c.e, c.ten);
    })));

    return {
      prompt: 'Con gì kêu <b>' + con.keu + '</b>?',
      speak: 'Con gì kêu ' + con.keu + '?',
      art: '🎵',
      answer: dung,
      choices: luaChon,
      cols: soLuaChon === 2 ? 2 : 3
    };
  }

  Quiz.init({
    id: 'mn-con-vat-keu',
    total: 8,
    kids: true,
    speak: true,
    levels: [
      { name: 'Dễ', hint: 'Chọn 1 trong 2 con', gen: function () { return cauHoi(2); } },
      { name: 'Khó hơn', hint: 'Chọn 1 trong 3 con', gen: function () { return cauHoi(3); } }
    ]
  });
</script>
</body>
</html>
