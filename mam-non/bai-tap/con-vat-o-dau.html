<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Con vật sống ở đâu — Mầm non</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>🏞️</text></svg>">
<script type="module" src="https://cdn.jsdelivr.net/npm/@lottiefiles/dotlottie-wc@0.6.2/dist/dotlottie-wc.js"></script>
</head>
<body>
<header class="topbar">
  <a class="back" href="../index.html">← Quay lại</a>
  <h1>🏞️ Sống ở đâu</h1>
</header>

<main id="quiz" class="quiz"></main>

<script src="../../js/o-tra-loi.js"></script>
<script src="../../js/hinh-ve.js"></script>
<script src="../../js/hoat-hinh.js"></script>
<script src="../../js/quiz.js"></script>
<script src="../../js/con-vat.js"></script>
<script>
  var NOI = ['nuoc', 'can', 'troi'];

  function cauHoi() {
    var con = Quiz.pick(ConVat.DS);
    var luaChon = NOI.map(function (k) {
      return ConVat.nut(ConVat.NOI_SONG[k].e, ConVat.NOI_SONG[k].ten);
    });

    return {
      prompt: con.ten + ' sống ở đâu?',
      art: ConVat.veCon(con, 130),
      answer: ConVat.nut(ConVat.NOI_SONG[con.o].e, ConVat.NOI_SONG[con.o].ten),
      choices: luaChon,
      cols: 3
    };
  }

  Quiz.init({
    id: 'mn-con-vat-o-dau',
    total: 8,
    kids: true,
    khongChu: true,
    speak: true,
    levels: [
      { name: 'Dưới nước, trên cạn hay trên trời?', gen: cauHoi }
    ]
  });
</script>
</body>
</html>
