<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đếm đến 5 — Mầm non</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>🖐️</text></svg>">
</head>
<body>
<header class="topbar">
  <a class="back" href="../index.html">← Quay lại</a>
  <h1>🖐️ Đếm cùng bé</h1>
</header>

<main id="quiz" class="quiz"></main>

<script src="../../js/quiz.js"></script>
<script src="../../js/con-vat.js"></script>
<script>
  function cauHoi(toiDa) {
    var con = Quiz.pick(ConVat.DS);
    var n = Quiz.randInt(1, toiDa);
    var luaChon = Quiz.choicesAround(n, 3, 1, toiDa);

    // nhiều con thì thu nhỏ lại, nếu không hàng nút bấm bị đẩy khỏi màn hình
    var coChu = n > 6 ? 0.42 : n > 4 ? 0.6 : 1;
    var hinh = Quiz.repeatArt(con.e, n);
    if (coChu < 1) hinh = '<span style="font-size:' + coChu + 'em">' + hinh + '</span>';

    return {
      prompt: 'Có mấy ' + con.ten + '?',
      art: hinh,
      answer: String(n),
      choices: luaChon.map(String),
      cols: 3
    };
  }

  Quiz.init({
    id: 'mn-dem-den-5',
    total: 8,
    kids: true,
    speak: true,
    levels: [
      { name: 'Đếm đến 3', gen: function () { return cauHoi(3); } },
      { name: 'Đếm đến 5', gen: function () { return cauHoi(5); } },
      { name: 'Đếm đến 10', gen: function () { return cauHoi(10); } }
    ]
  });
</script>
</body>
</html>
