<script>
  var T = ToanL6;

  // Lớp trên không học Tiếng Việt ở đây nên hai mạch xen kẽ là Tính và Đố
  GameHalloween.batDau('game', {
    khoa: 'studyonline:game-halloween-l6',
    mon: ['Tính', 'Đố'],
    ai: [
    { ten: 'Cổng Bí Ngô', hinh: 'bi-ngo', quai: 'bi-ngo', nen: 'vuon-bi-ngo', hop: 'thung', emoji: '🎃', mau: '#ff8f3c', soCau: 6,
      mota: 'Lũy thừa · dấu hiệu chia hết',
      toan: function () { return Quiz.pick([T.luyThua, T.nhanLuyThua, T.bieuThucCoNgoac])(); },
      tviet: function () { return Quiz.pick([T.dauHieuChiaHet6, T.tapHopPhanTu, T.demUoc])(); } },

    { ten: 'Lối Mòn Ma Trơi', hinh: 'ma', quai: 'than-chet', nen: 'rung-suong', hop: 'bia-mo', emoji: '👻', mau: '#8b7bf7', soCau: 6,
      mota: 'Số nguyên tố · ước chung, bội chung',
      toan: function () { return Quiz.pick([T.soNguyenTo, T.thuaSoNguyenToLonNhat, T.boiNhoNhat])(); },
      tviet: function () { return Quiz.pick([T.timUCLN, T.timBCNN])(); } },

    { ten: 'Rừng Dơi Đen', hinh: 'canh/doi', quai: 'nguoi-soi', nen: 'nghia-dia', hop: 'ruong', emoji: '🦇', mau: '#4b3bb0', soCau: 6,
      mota: 'Số nguyên âm · so sánh',
      toan: function () { return Quiz.pick([T.congSoNguyen, T.truSoNguyen, T.nhanSoNguyen, T.chiaSoNguyen])(); },
      tviet: function () { return Quiz.pick([T.soSanhSoNguyen, T.giaTriTuyetDoi, T.boDauNgoac, T.timXLop6])(); } },

    { ten: 'Nghĩa Địa Mèo Đen', hinh: 'meo-phu-thuy', quai: 'ma', nen: 'gac-mai', hop: 'bi-ngo', emoji: '🐈‍⬛', mau: '#2b2f55', soCau: 7,
      mota: 'Phân số · phần trăm',
      toan: function () { return Quiz.pick([T.rutGonPS6, T.soSanhPhanSo, T.congPSKhacMau,
        T.truPSKhacMau, T.nhanChiaPS6, T.honSoThanhPhanSo])(); },
      tviet: function () { return Quiz.pick([T.phanTram6, T.tiSoPhanTram6, T.timSoBietPhanTram,
        T.phanSoCuaMotSo, T.nhanThapPhan, T.lamTronThapPhan])(); } },

    { ten: 'Lâu Đài Phù Thuỷ', hinh: 'phu-thuy', quai: 'phu-thuy', nen: 'dam-lay', hop: 'thung', emoji: '🧙', mau: '#6a58e0', soCau: 7, trum: true,
      mota: 'Hình học · thống kê',
      toan: function () { return Quiz.pick([T.dienTichHinhThang, T.dienTichHinhBinhHanh,
        T.dienTichHinhThoi, T.chuViHinhChuNhat6, T.chuViLucGiac, T.trungDiem, T.congGoc,
        T.demTrucDoiXung])(); },
      tviet: function () { return Quiz.pick([T.trungBinhCong6, T.xacSuatDonGian,
        T.xacSuatThucNghiem, T.docBieuDoCot, T.doiDonVi6])(); } }
    ]
  });
