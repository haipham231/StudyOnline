<script>
  var T = ToanL6;

  // Lớp trên không học Tiếng Việt ở đây nên hai mạch xen kẽ là Tính và Đố
  GameHalloween.batDau('game', {
    khoa: 'studyonline:game-halloween-l6',
    mon: ['Tính', 'Đố'],
    ai: [
    { ten: 'Cổng Bí Ngô', hinh: 'bi-ngo', emoji: '🎃', mau: '#ff8f3c', soCau: 6,
      mota: 'Lũy thừa · dấu hiệu chia hết',
      toan: T.luyThua,
      tviet: T.dauHieuChiaHet6 },

    { ten: 'Lối Mòn Ma Trơi', hinh: 'ma', emoji: '👻', mau: '#8b7bf7', soCau: 6,
      mota: 'Số nguyên tố · ƯCLN BCNN',
      toan: T.soNguyenTo,
      tviet: function () { return Quiz.pick([T.timUCLN, T.timBCNN])(); } },

    { ten: 'Rừng Dơi Đen', hinh: 'canh/doi', emoji: '🦇', mau: '#4b3bb0', soCau: 6,
      mota: 'Số nguyên âm · so sánh',
      toan: function () { return Quiz.pick([T.congSoNguyen, T.nhanSoNguyen])(); },
      tviet: T.soSanhSoNguyen },

    { ten: 'Nghĩa Địa Mèo Đen', hinh: 'meo-phu-thuy', emoji: '🐈‍⬛', mau: '#2b2f55', soCau: 7,
      mota: 'Phân số · phần trăm',
      toan: function () { return Quiz.pick([T.rutGonPS6, T.congPSKhacMau, T.nhanChiaPS6])(); },
      tviet: function () { return Quiz.pick([T.phanTram6, T.timSoBietPhanTram])(); } },

    { ten: 'Lâu Đài Phù Thuỷ', hinh: 'phu-thuy', emoji: '🧙', mau: '#6a58e0', soCau: 7, trum: true,
      mota: 'Hình học · thống kê',
      toan: function () { return Quiz.pick([T.dienTichHinhThang, T.chuViLucGiac, T.trungDiem, T.congGoc])(); },
      tviet: function () { return Quiz.pick([T.trungBinhCong6, T.xacSuatDonGian])(); } }
    ]
  });
</script>
