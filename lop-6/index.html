<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Học Lớp 6</title>
<meta name="description" content="Lớp 6: Tập hợp, lũy thừa, số nguyên âm, phân số, hình học trực quan, thống kê — và cả Tiếng Anh. Có ba game, bài nâng cao và bộ đề kiểm tra.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>🎓</text></svg>">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="back" href="../index.html">← Chọn lứa tuổi</a>
  </header>

  <div class="hero">
    <div class="mascot">🎓</div>
    <h1>Học Lớp 6</h1>
    <p id="loi-chao">Tập hợp, lũy thừa, số nguyên âm, phân số, hình học trực quan, thống kê — và cả Tiếng Anh.</p>
  </div>

  <main id="noi-dung"></main>
</div>

<script src="../js/quiz.js"></script>
<script src="../js/danh-hieu.js"></script>
<script>
  var NHOM = [
    { ten: 'Số tự nhiên', kieu: 'kieu-sticker', bai: [
      { id: 'tap-hop', emoji: '🗂️', mau: '#ff8fd0', ten: 'Tập hợp, ước và bội', mo_ta: 'Đếm phần tử, dấu thuộc, ước và bội.' },
      { id: 'luy-thua', emoji: '🔢', mau: '#8b7bf7', ten: 'Lũy thừa và thứ tự phép tính', mo_ta: 'Lũy thừa với số mũ tự nhiên, nhân chia lũy thừa.' },
      { id: 'so-nguyen-to', emoji: '🔑', mau: '#2fcf90', ten: 'Số nguyên tố, ước chung, bội chung', mo_ta: 'Phân tích ra thừa số nguyên tố.' },
      { id: 'chia-het', emoji: '➗', mau: '#4aa8ff', ten: 'Dấu hiệu chia hết', mo_ta: 'Chia hết cho 2, 3, 5, 9.' },
      { id: 'tim-x', emoji: '❓', mau: '#ffc93c', ten: 'Tìm x và biểu thức', mo_ta: 'Biểu thức có ngoặc, bốn dạng tìm x.' },
      { id: 'so-nguyen', emoji: '➖', mau: '#ff7a7a', ten: 'Số nguyên âm', mo_ta: 'Cộng trừ nhân chia số nguyên, giá trị tuyệt đối.' }
    ] },
    { ten: 'Phân số và số thập phân', kieu: 'kieu-sticker', bai: [
      { id: 'phan-so', emoji: '🍰', mau: '#ff8fd0', ten: 'Phân số', mo_ta: 'Rút gọn, so sánh, quy đồng, hỗn số, toán ngược.' },
      { id: 'thap-phan', emoji: '🔟', mau: '#ffc93c', ten: 'Số thập phân và phần trăm', mo_ta: 'Bốn phép tính, làm tròn và tỉ số phần trăm.' }
    ] },
    { ten: 'Hình học và thống kê', kieu: 'kieu-sticker', bai: [
      { id: 'hinh-truc-quan', emoji: '🔷', mau: '#4aa8ff', ten: 'Hình học trực quan', mo_ta: 'Tam giác đều, lục giác đều, hình thoi, hình thang cân.' },
      { id: 'chu-vi-dien-tich', emoji: '📏', mau: '#2fcf90', ten: 'Chu vi và diện tích', mo_ta: 'Hình thang, hình bình hành, hình thoi và đổi đơn vị.' },
      { id: 'doi-xung', emoji: '🪞', mau: '#ff7a7a', ten: 'Hình có trục đối xứng', mo_ta: 'Trục đối xứng và tâm đối xứng.' },
      { id: 'diem-doan-goc', emoji: '📐', mau: '#8b7bf7', ten: 'Điểm, đoạn thẳng, góc', mo_ta: 'Trung điểm và số đo góc.' },
      { id: 'thong-ke', emoji: '📊', mau: '#ffc93c', ten: 'Thống kê và xác suất', mo_ta: 'Đọc biểu đồ cột, trung bình cộng, xác suất.' }
    ] },
    { ten: 'Tiếng Anh', kieu: 'kieu-hinh', bai: [
      { id: 'ta-thi', emoji: '⏰', mau: '#4aa8ff', ten: 'Các thì', mo_ta: 'To be, hiện tại đơn, tiếp diễn, quá khứ, tương lai gần.' },
      { id: 'ta-ngu-phap', emoji: '🔤', mau: '#8b7bf7', ten: 'Ngữ pháp', mo_ta: 'So sánh, mạo từ, giới từ, khuyết thiếu, số nhiều.' },
      { id: 'ta-cau', emoji: '💬', mau: '#ff8fd0', ten: 'Câu và từ loại', mo_ta: 'There is, từ để hỏi, sở hữu, tần suất, trật tự câu.' },
      { id: 'ta-tu-vung', emoji: '📒', mau: '#2fcf90', ten: 'Từ vựng', mo_ta: '120 từ theo 12 chủ đề sách lớp 6, trái nghĩa, khác loại.' },
      { id: 'ta-doc-hieu', emoji: '📖', mau: '#ffc93c', ten: 'Đọc hiểu', mo_ta: 'Bảy bài đọc tiếng Anh rồi trả lời câu hỏi.' }
    ] }
  ];

  var TRO_CHOI = [
    { id: 'cau-ca', emoji: '🎣', mau: '#4aa8ff', ten: 'Câu cá cùng bé',
      mo_ta: 'Chọn hồ dễ, vừa hay khó rồi trả lời 10 câu. Đúng thì câu được cá bỏ vào xô!',
      href: 'cau-ca.html' },
    { id: 'cuu-cong-chua', emoji: '🗡️', mau: '#ff8fd0', ten: 'Giải cứu công chúa',
      mo_ta: 'Rồng bắt mất công chúa rồi! Vượt 5 chặng, giải đúng bài toán để tiến bước.',
      href: 'cuu-cong-chua.html' },
    { id: 'halloween', emoji: '🎃', mau: '#ff8f3c', ten: 'Đêm Halloween',
      mo_ta: 'Phù thuỷ giấu hết kẹo! Vượt 5 ải, xen kẽ hai mạch đề để đòi lại kẹo.',
      href: 'halloween.html' },
    { id: 'du-hanh-vu-tru', emoji: '🚀', mau: '#8b7bf7', ten: 'Du hành vũ trụ',
      mo_ta: 'Bay qua 6 hành tinh: bắn tên lửa vào quái vật giữ đáp án đúng, rồi lái phi thuyền qua cổng.',
      href: 'du-hanh-vu-tru.html' }
  ];

  var KIEM_TRA = [
    { id: 'l6-kiem-tra', emoji: '📝', mau: '#8b7bf7', ten: 'Bài kiểm tra Toán',
      mo_ta: 'Tám bộ đề: ba đề theo mốc năm học và năm đề luyện tập, khoảng 30 câu mỗi đề.',
      href: 'kiem-tra.html' },
    { id: 'l6-kiem-tra-anh', emoji: '🔠', mau: '#4aa8ff', ten: 'Bài kiểm tra Tiếng Anh',
      mo_ta: 'Năm bộ đề ngữ pháp, từ vựng và đọc hiểu. Chấm xong Cô Nhi giảng lại câu sai.',
      href: 'kiem-tra-anh.html' },
    { id: 'l6-nang-cao', emoji: '🚀', mau: '#ff7a7a', ten: 'Bài tập nâng cao',
      mo_ta: 'Dạng khó hơn hẳn. Chấm xong, Cô Nhi hiện lên giảng lại từng câu sai.',
      href: 'nang-cao.html' }
  ];

  var goc = document.getElementById('noi-dung');
  var tongSao = 0;

  function taoThe(bai, noiBat, kieu) {
    var best = Quiz.readBest(noiBat ? bai.id : 'l6-' + bai.id);
    // Kỷ lục bài tập và tiến độ trò chơi nằm chung một kho localStorage, mà
    // thẻ trò chơi lớp 1 lại trùng tên khoá với chính game đó. Đọc trúng gói
    // tiến độ {mo, sao} thì best.score là undefined, thẻ hiện "undefined điểm".
    // Chỉ nhận gói nào thật sự là kỷ lục bài tập.
    if (best && typeof best.score !== 'number') best = null;

    var sao = best ? Quiz.starsFor(best.correct, best.total) : 0;
    if (!noiBat) tongSao += sao;

    var card = document.createElement('a');
    card.className = 'card';
    card.href = bai.href || ('bai-tap/' + bai.id + '.html');
    card.style.setProperty('--tint', bai.mau);

    var huy = '', ptDe = null;
    if (bai.id === 'l6-kiem-tra' || bai.id === 'l6-kiem-tra-anh') {
      var ds = Quiz.readLichSu(bai.id);
      if (ds.length) {
        huy = '<span class="best">Lần gần nhất: ' + ds[0].diem + '/10 — ' + ds[0].de + '</span>';
        ptDe = ds[0].diem * 10;
      }
    } else if (best) {
      huy = '<span class="best">' + '⭐'.repeat(sao) + ' ' + best.score + ' điểm</span>';
    }

    if (kieu === 'kieu-tien-do') {
      var phanTram = ptDe != null ? ptDe : (best ? Math.round(best.correct / best.total * 100) : 0);
      var nhan = best || ptDe != null
        ? '⭐'.repeat(sao) + '<span class="mo-sao">' + '⭐'.repeat(3 - sao) + '</span>'
        : 'Chưa làm';
      card.innerHTML =
        '<div class="dau-the"><div class="emoji">' + bai.emoji + '</div>' +
        '<div><h2>' + bai.ten + '</h2><p>' + bai.mo_ta + '</p></div></div>' +
        '<div class="thanh-the"><i style="width:' + phanTram + '%"></i></div>' +
        '<div class="duoi-the"><span>' + nhan + '</span><b>' + phanTram + '%</b></div>' + huy;
      return card;
    }

    card.innerHTML =
      '<div class="emoji">' + bai.emoji + '</div>' +
      '<h2>' + bai.ten + '</h2>' +
      '<p>' + bai.mo_ta + '</p>' + huy;
    return card;
  }

  function veNhom(ten, kieu, ds, noiBat) {
    var tieu = document.createElement('h2');
    tieu.className = 'nhom';
    tieu.textContent = ten;
    goc.appendChild(tieu);

    var luoi = document.createElement('div');
    luoi.className = 'grid ' + kieu;
    ds.forEach(function (b) { luoi.appendChild(taoThe(b, noiBat, kieu)); });
    goc.appendChild(luoi);
  }

  veNhom('Trò chơi', 'kieu-keo', TRO_CHOI, true);
  veNhom('Bài kiểm tra và nâng cao', 'kieu-tien-do', KIEM_TRA, true);
  NHOM.forEach(function (nhom) { veNhom(nhom.ten, nhom.kieu, nhom.bai, false); });

  if (tongSao > 0) {
    document.getElementById('loi-chao').innerHTML =
      'Bé đã sưu tầm được <b>' + tongSao + ' ⭐</b> — cố lên nào!';
  }
</script>
</body>
</html>
