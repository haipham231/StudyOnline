<script>
  var T = ToanL6;
  var V = TiengAnhL6;

  Quiz.init({
    id: 'l6-ta-cau',
    total: 10,
    speak: true,
    levels: [
      { name: 'Động từ to be', hint: 'am, is, are',
        gen: V.dongTuToBe },
      { name: 'There is, there are', hint: 'Có một hay có nhiều',
        gen: V.coKhongCo },
      { name: 'Từ để hỏi', hint: 'What, where, when, who, why, how',
        gen: V.tuDeHoi },
      { name: 'Đại từ và sở hữu', hint: 'my, her, him, Nam’s',
        gen: V.daiTuSoHuu },
      { name: 'Trạng từ tần suất', hint: 'always, usually, often, never',
        gen: V.trangTuTanSuat },
      { name: 'Mệnh lệnh và liên từ', hint: 'Close the door, and, but, so, because',
        gen: function () { return Quiz.pick([V.cauMenhLenh, V.lienTu])(); } },
      { name: 'Trật tự câu', hint: 'Câu nào viết đúng',
        gen: V.trongCauDung }
    ]
  });
