<body>
<header class="topbar">
  <a class="back" href="../index.html">← Quay lại</a>
  <h1>🔤 Ngữ pháp</h1>
</header>

<main id="quiz" class="quiz"></main>

<script src="../../js/o-tra-loi.js"></script>
<script src="../../js/quiz.js"></script>
<script src="../../js/toan-lop-6.js"></script>
<script src="../../js/tieng-anh-lop-6.js"></script>
<script>
  var T = ToanL6;
  var V = TiengAnhL6;

  Quiz.init({
    id: 'l6-ta-ngu-phap',
    total: 10,
    speak: true,
    levels: [
      { name: 'So sánh', hint: 'Hơn và nhất',
        gen: V.soSanhHonNhat },
      { name: 'Mạo từ', hint: 'a, an, the',
        gen: V.maoTu },
      { name: 'Giới từ', hint: 'in, on, at, under, next to',
        gen: V.gioiTu },
      { name: 'Động từ khuyết thiếu', hint: 'can, should, must',
        gen: V.dongTuKhuyetThieu },
      { name: 'Đếm được và không đếm được', hint: 'many, much, some, any',
        gen: V.demDuocKhongDem },
      { name: 'Danh từ số nhiều', hint: 'books, boxes, children, teeth',
        gen: V.danhTuSoNhieu },
      { name: 'Trộn tất cả', hint: 'Mỗi câu một điểm ngữ pháp',
        gen: function () {
          return Quiz.pick([V.soSanhHonNhat, V.maoTu, V.gioiTu, V.dongTuKhuyetThieu,
            V.demDuocKhongDem, V.danhTuSoNhieu])();
        } }
    ]
  });
</script>
