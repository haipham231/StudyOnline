        gen: T.boiNhoNhat },
      { name: 'Trộn cả bốn phần', hint: 'Mỗi câu một kiểu',
        gen: function () { return Quiz.pick([T.tapHopPhanTu, T.phanTuThuocTapHop, T.demUoc, T.boiNhoNhat])(); } }

  });
