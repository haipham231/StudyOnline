<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bài kiểm tra — Toán lớp 6</title>
<meta name="description" content="Ba bộ đề kiểm tra Toán lớp 6: giữa kì 1, cuối kì 1 và cuối năm. Máy chấm điểm thang 10.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>📝</text></svg>">
</head>
<body>
<header class="topbar">
  <a class="back" href="index.html">← Quay lại</a>
  <h1>📝 Bài kiểm tra Toán lớp 6</h1>
</header>

<main id="quiz" class="quiz"></main>

<script src="../js/o-tra-loi.js"></script>
<script src="../js/quiz.js"></script>
<script src="../js/toan-lop-6.js"></script>
<script>
  var T = ToanL6;

  /* Ma trận đề — mỗi dòng là [số câu, hàm sinh đề], bám ba mốc của năm học. */
  var MA_TRAN = {
    'giua-ki-1': [
      [4, T.luyThua],
      [3, T.nhanLuyThua],
      [3, T.dauHieuChiaHet6],
      [3, T.soNguyenTo],
      [3, T.timUCLN],
      [2, T.timBCNN],
      [2, T.thuTuPhepTinh]
    ],
    'cuoi-ki-1': [
      [3, T.congSoNguyen],
      [3, T.nhanSoNguyen],
      [2, T.soSanhSoNguyen],
      [3, T.timUCLN],
      [3, T.timBCNN],
      [3, T.nhanBietHinh6],
      [3, T.chuViLucGiac]
    ],
    'cuoi-nam': [
      [3, T.rutGonPS6],
      [3, T.congPSKhacMau],
      [2, T.nhanChiaPS6],
      [2, T.phanTram6],
      [2, T.timSoBietPhanTram],
      [2, T.dienTichHinhThang],
      [2, T.trungDiem],
      [2, T.congGoc],
      [3, T.trungBinhCong6]
    ],
    'luyen-1': [
      [4, T.luyThua],
      [3, T.thuTuPhepTinh],
      [3, T.congSoNguyen],
      [3, T.nhanSoNguyen],
      [3, T.soNguyenTo],
      [4, function () { return Quiz.pick([T.timUCLN, T.timBCNN])(); }]
    ],
    'luyen-2': [
      [4, T.rutGonPS6],
      [4, T.congPSKhacMau],
      [3, T.nhanChiaPS6],
      [3, T.thapPhan6],
      [3, T.phanTram6],
      [3, T.timSoBietPhanTram]
    ],
    'luyen-3': [
      [3, T.nhanBietHinh6],
      [3, T.chuViLucGiac],
      [3, T.dienTichHinhThang],
      [3, T.trungDiem],
      [3, T.loaiGoc],
      [3, T.congGoc],
      [2, T.trungBinhCong6],
      [2, T.xacSuatDonGian]
    ]
  };

  // Dựng đề: sinh đủ số câu mỗi phần, loại đề trùng nhau, rồi xáo trộn thứ tự
  function taoDe(ten) {
    var de = [];
    var daCo = {};
    MA_TRAN[ten].forEach(function (dong) {
      var soCau = dong[0], sinh = dong[1];
      for (var i = 0; i < soCau; i++) {
        var q, khoa, lan = 0;
        do {
          q = sinh();
          khoa = (q.prompt || '') + (q.text || '') + (q.after || '') + q.answer;
          lan++;
        } while (daCo[khoa] && lan < 25);
        daCo[khoa] = true;
        de.push(q);
      }
    });
    return Quiz.shuffle(de);
  }

  function demCau(ten) {
    return MA_TRAN[ten].reduce(function (t, d) { return t + d[0]; }, 0);
  }

  Quiz.init({
    id: 'l6-kiem-tra',
    exam: true,
    levels: [
      { name: 'Đề giữa học kì 1',
        hint: demCau('giua-ki-1') + ' câu · lũy thừa, chia hết, số nguyên tố',
        taoDe: function () { return taoDe('giua-ki-1'); } },
      { name: 'Đề cuối học kì 1',
        hint: demCau('cuoi-ki-1') + ' câu · số nguyên âm, ƯCLN BCNN, hình học',
        taoDe: function () { return taoDe('cuoi-ki-1'); } },
      { name: 'Đề cuối năm học',
        hint: demCau('cuoi-nam') + ' câu · cả năm — phân số, phần trăm, góc',
        taoDe: function () { return taoDe('cuoi-nam'); } },
      { name: 'Đề luyện tập 1',
        hint: demCau('luyen-1') + ' câu · trộn cả năm, nhấn số tự nhiên và số nguyên',
        taoDe: function () { return taoDe('luyen-1'); } },
      { name: 'Đề luyện tập 2',
        hint: demCau('luyen-2') + ' câu · trộn cả năm, nhấn phân số và số thập phân',
        taoDe: function () { return taoDe('luyen-2'); } },
      { name: 'Đề luyện tập 3',
        hint: demCau('luyen-3') + ' câu · trộn cả năm, nhấn hình học và thống kê',
        taoDe: function () { return taoDe('luyen-3'); } }
    ]
  });
</script>
</body>
</html>
