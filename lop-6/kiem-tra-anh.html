<head>

<meta name="description" content="Năm bộ đề kiểm tra Tiếng Anh lớp 6: ngữ pháp, từ vựng và đọc hiểu. Máy chấm điểm thang 10 và Cô Nhi giảng lại từng câu sai.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

</head>
<body>
<header class="topbar">
  <a class="back" href="index.html">← Quay lại</a>
  <h1>🔠 Bài kiểm tra Tiếng Anh lớp 6</h1>
</header>

<main id="quiz" class="quiz"></main>

<script src="../js/o-tra-loi.js"></script>
<script src="../js/quiz.js"></script>
<script src="../js/tro-ly.js"></script>
<script src="../js/tieng-anh-lop-6.js"></script>
<script>
  var V = TiengAnhL6;

  /* Ma trận đề — mỗi dòng là [số câu, hàm sinh đề]. Đề giữa kì bám nửa đầu
     chương trình, đề cuối kì và cuối năm trộn rộng hơn. */
  var MA_TRAN = {
    'giua-ki-1': [
      [4, V.dongTuToBe],
      [4, V.hienTaiDon],
      [3, V.coKhongCo],
      [3, V.maoTu],
      [3, V.tuDeHoi],
      [3, V.daiTuSoHuu],
      [4, V.nghiaTuVung],
      [3, V.tuTiengAnh],
      [3, V.docHieu6]
    ],
    'cuoi-ki-1': [
      [3, V.hienTaiDon],
      [3, V.hienTaiTiepDien],
      [3, V.gioiTu],
      [3, V.trangTuTanSuat],
      [3, V.danhTuSoNhieu],
      [3, V.demDuocKhongDem],
      [3, V.cauMenhLenh],
      [4, V.nghiaTuVung],
      [3, V.traiNghia],
      [3, V.docHieu6]
    ],
    'cuoi-nam': [
      [3, V.quaKhuDon],
      [3, V.tuongLaiGan],
      [3, V.soSanhHonNhat],
      [3, V.dongTuKhuyetThieu],
      [3, V.lienTu],
      [3, V.trongCauDung],
      [3, V.tuKhacLoai],
      [4, V.tuTiengAnh],
      [3, V.nghiaTuVung],
      [4, V.docHieu6]
    ],
    'luyen-ngu-phap': [
      [3, V.dongTuToBe],
      [3, V.hienTaiDon],
      [3, V.hienTaiTiepDien],
      [3, V.quaKhuDon],
      [3, V.tuongLaiGan],
      [3, V.coKhongCo],
      [3, V.maoTu],
      [3, V.gioiTu],
      [3, V.dongTuKhuyetThieu],
      [3, V.danhTuSoNhieu]
    ],
    'luyen-tu-vung': [
      [6, V.nghiaTuVung],
      [6, V.tuTiengAnh],
      [4, V.traiNghia],
      [4, V.tuKhacLoai],
      [4, V.trongCauDung],
      [6, V.docHieu6]
    ]
  };

  // Dựng đề: sinh đủ số câu mỗi phần, loại đề trùng nhau, rồi xáo trộn thứ tự
  function taoDe(ten) {
    var de = [];
    var daCo = {};
    MA_TRAN[ten].forEach(function (dong) {
      var soCau = dong[0], sinh = dong[1];
      for (var i = 0; i < soCau; i++) {
        var q, khoa, lan = 0;
        do {
          q = sinh();
          khoa = (q.prompt || '') + (q.text || '') + (q.after || '') + q.answer;
          lan++;
        } while (daCo[khoa] && lan < 40);
        daCo[khoa] = true;
        de.push(q);
      }
    });
    return Quiz.shuffle(de);
  }

  function demCau(ten) {
    return MA_TRAN[ten].reduce(function (t, d) { return t + d[0]; }, 0);
  }

  Quiz.init({
    id: 'l6-kiem-tra-anh',
    exam: true,
    speak: true,
    troLy: true,
    levels: [
      { name: 'Đề giữa học kì 1',
        hint: demCau('giua-ki-1') + ' câu · to be, hiện tại đơn, mạo từ, từ vựng',
        taoDe: function () { return taoDe('giua-ki-1'); } },
      { name: 'Đề cuối học kì 1',
        hint: demCau('cuoi-ki-1') + ' câu · tiếp diễn, giới từ, số nhiều, đọc hiểu',
        taoDe: function () { return taoDe('cuoi-ki-1'); } },
      { name: 'Đề cuối năm học',
        hint: demCau('cuoi-nam') + ' câu · cả năm — quá khứ, tương lai gần, so sánh',
        taoDe: function () { return taoDe('cuoi-nam'); } },
      { name: 'Đề luyện ngữ pháp',
        hint: demCau('luyen-ngu-phap') + ' câu · chỉ ngữ pháp, trộn cả năm',
        taoDe: function () { return taoDe('luyen-ngu-phap'); } },
      { name: 'Đề luyện từ vựng và đọc hiểu',
        hint: demCau('luyen-tu-vung') + ' câu · 120 từ theo chủ đề và bảy bài đọc',
        taoDe: function () { return taoDe('luyen-tu-vung'); } }
    ]
  });
</script>
</body>
</html>
