<script>
  var T = ToanL3;
  function mix() {
    var ds = Array.prototype.slice.call(arguments);
    // giữ lại danh sách để MucDo bớt dạng khi chơi mức Dễ
    var f = function () { return Quiz.pick(ds)(); };
    f.ds = ds;
    return f;
  }

  GameCauCa.batDau('game', {
    khoa: 'studyonline:game-cau-ca-l3',
    ho: [
    { id: 'ao', ten: 'Ao Nhỏ', mucDo: 'Dễ', emoji: '🪣', mau: '#2fcf90', nen: '#e4f9f0',
      dan: ['cau-ca/ca-nho', 'cau-ca/cua'], coCa: 48,
      mota: 'Bảng nhân chia 2–9, gấp giảm',
      de: mix(function () { return T.bangNhan(); }, function () { return T.bangChia(); }, T.gapGiam) },

    { id: 'song', ten: 'Sông Lớn', mucDo: 'Vừa', emoji: '🏞️', mau: '#4aa8ff', nen: '#e3f1ff',
      dan: ['cau-ca/ca-vua', 'cau-ca/bach-tuoc', 'cau-ca/cua'], coCa: 66,
      mota: 'Nhân chia ngoài bảng, biểu thức, xem giờ',
      de: mix(function () { return T.nhanNgoaiBang(2); }, T.chiaNgoaiBang, T.bieuThuc, T.xemGioPhut, T.gapMayLan) },

    { id: 'bien', ten: 'Biển Sâu', mucDo: 'Khó', emoji: '🌊', mau: '#6a58e0', nen: '#ece8ff',
      dan: ['cau-ca/ca-map', 'cau-ca/ca-voi', 'cau-ca/sua', 'cau-ca/bach-tuoc'], coCa: 80,
      mota: 'Chia có dư, chu vi diện tích, toán đố hai bước',
      de: mix(T.chiaCoDu, T.chuViChuNhat, T.dienTichChuNhat, T.doHaiBuoc, T.doTimPhan, T.doiDonViL3) }
    ]
  });
</script>
