<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Học Lớp 2</title>
<meta name="description" content="Lớp 2: Phạm vi 1000, bảng nhân chia 2 và 5, xem giờ và đo lường. Có ba game, bài nâng cao và bộ đề kiểm tra.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>🧮</text></svg>">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="back" href="../index.html">← Chọn lứa tuổi</a>
  </header>

  <div class="hero">
    <div class="mascot">🧮</div>
    <h1>Học Lớp 2</h1>
    <p id="loi-chao">Phạm vi 1000, bảng nhân chia 2 và 5, xem giờ và đo lường.</p>
  </div>

  <main id="noi-dung"></main>
</div>

<script src="../js/quiz.js"></script>
<script src="../js/danh-hieu.js"></script>
<script>
  var NHOM = [
    { ten: 'Số và phép tính', kieu: 'kieu-sticker', bai: [
      { id: 'cong-tru-100', emoji: '➕', mau: '#4aa8ff', ten: 'Cộng trừ trong 100', mo_ta: 'Có nhớ và không nhớ, tính nhẩm tròn chục.' },
      { id: 'cong-tru-1000', emoji: '💯', mau: '#2fcf90', ten: 'Cộng trừ trong 1000', mo_ta: 'Số có ba chữ số.' },
      { id: 'nhan-chia', emoji: '✖️', mau: '#8b7bf7', ten: 'Bảng nhân chia 2 và 5', mo_ta: 'Nhân chia trong bảng.' },
      { id: 'thanh-phan', emoji: '🏷️', mau: '#ff8fd0', ten: 'Tên gọi thành phần', mo_ta: 'Số hạng, tổng, thừa số, tích…' },
      { id: 'tim-x', emoji: '🧩', mau: '#ffc93c', ten: 'Tìm x', mo_ta: 'Tìm số còn thiếu trong phép cộng trừ.' },
      { id: 'so-ba-chu-so', emoji: '🔢', mau: '#ff7a7a', ten: 'Số có ba chữ số', mo_ta: 'Cấu tạo số, so sánh, dãy số.' }
    ] },
    { ten: 'Đo lường và thời gian', kieu: 'kieu-sticker', bai: [
      { id: 'do-luong', emoji: '📏', mau: '#2fcf90', ten: 'Đơn vị đo', mo_ta: 'cm, dm, m, kg, lít.' },
      { id: 'xem-gio', emoji: '🕐', mau: '#4aa8ff', ten: 'Xem giờ và ngày tháng', mo_ta: 'Giờ đúng, giờ rưỡi, 15 phút.' },
      { id: 'hinh-hoc', emoji: '🔷', mau: '#8b7bf7', ten: 'Hình học', mo_ta: 'Hình tứ giác, chu vi, đường gấp khúc.' }
    ] },
    { ten: 'Tiếng Việt', kieu: 'kieu-hinh', bai: [
      { id: 'tv-tu-loai', emoji: '🏷️', mau: '#ff8fd0', ten: 'Từ loại', mo_ta: 'Từ chỉ sự vật, hoạt động, đặc điểm.' },
      { id: 'tv-cau-dau', emoji: '📝', mau: '#4aa8ff', ten: 'Câu và dấu câu', mo_ta: 'Ai là gì, Ai làm gì, Ai thế nào và dấu cuối câu.' },
      { id: 'tv-chinh-ta', emoji: '✍️', mau: '#2fcf90', ten: 'Chính tả và từ ngữ', mo_ta: 'Viết đúng, quy tắc c/k, g/gh, ng/ngh, từ trái nghĩa.' },
      { id: 'tv-doc-hieu', emoji: '📖', mau: '#ffc93c', ten: 'Đọc hiểu', mo_ta: 'Đọc đoạn ngắn rồi trả lời.' }
    ] },
    { ten: 'Giải toán có lời văn', kieu: 'kieu-sticker', bai: [
      { id: 'toan-do', emoji: '📖', mau: '#ff8f3c', ten: 'Toán đố', mo_ta: 'Nhiều hơn, ít hơn, gấp mấy lần, chia đều.' }
    ] }
  ];

  var TRO_CHOI = [
    { id: 'cau-ca', emoji: '🎣', mau: '#4aa8ff', ten: 'Câu cá cùng bé',
      mo_ta: 'Chọn hồ dễ, vừa hay khó rồi trả lời 10 câu. Đúng thì câu được cá bỏ vào xô!',
      href: 'cau-ca.html' },
    { id: 'cuu-cong-chua', emoji: '🗡️', mau: '#ff8fd0', ten: 'Giải cứu công chúa',
      mo_ta: 'Rồng bắt mất công chúa rồi! Vượt 5 chặng, giải đúng bài toán để tiến bước.',
      href: 'cuu-cong-chua.html' },
    { id: 'halloween', emoji: '🎃', mau: '#ff8f3c', ten: 'Đêm Halloween',
      mo_ta: 'Phù thuỷ giấu hết kẹo! Vượt 5 ải, xen kẽ hai mạch đề để đòi lại kẹo.',
      href: 'halloween.html' },
    { id: 'du-hanh-vu-tru', emoji: '🚀', mau: '#8b7bf7', ten: 'Du hành vũ trụ',
      mo_ta: 'Bay qua 6 hành tinh: bắn tên lửa vào quái vật giữ đáp án đúng, rồi lái phi thuyền qua cổng.',
      href: 'du-hanh-vu-tru.html' }
  ];

  var KIEM_TRA = [
    { id: 'l2-kiem-tra', emoji: '📝', mau: '#8b7bf7', ten: 'Bài kiểm tra',
      mo_ta: 'Sáu bộ đề: ba đề theo mốc năm học và ba đề luyện tập. Máy chấm điểm thang 10.',
      href: 'kiem-tra.html' },
    { id: 'l2-nang-cao', emoji: '🚀', mau: '#ff7a7a', ten: 'Bài tập nâng cao',
      mo_ta: 'Dạng khó hơn hẳn. Chấm xong, trợ lý giải lại từng câu sai theo từng bước.',
      href: 'nang-cao.html' }
  ];

  var goc = document.getElementById('noi-dung');
  var tongSao = 0;

  function taoThe(bai, noiBat, kieu) {
    var best = Quiz.readBest(noiBat ? bai.id : 'l2-' + bai.id);
    var sao = best ? Quiz.starsFor(best.correct, best.total) : 0;
    if (!noiBat) tongSao += sao;

    var card = document.createElement('a');
    card.className = 'card';
    card.href = bai.href || ('bai-tap/' + bai.id + '.html');
    card.style.setProperty('--tint', bai.mau);

    var huy = '', ptDe = null;
    if (bai.id === 'l2-kiem-tra') {
      var ds = Quiz.readLichSu('l2-kiem-tra');
      if (ds.length) {
        huy = '<span class="best">Lần gần nhất: ' + ds[0].diem + '/10 — ' + ds[0].de + '</span>';
        ptDe = ds[0].diem * 10;
      }
    } else if (best) {
      huy = '<span class="best">' + '⭐'.repeat(sao) + ' ' + best.score + ' điểm</span>';
    }

    if (kieu === 'kieu-tien-do') {
      var phanTram = ptDe != null ? ptDe : (best ? Math.round(best.correct / best.total * 100) : 0);
      var nhan = best || ptDe != null
        ? '⭐'.repeat(sao) + '<span class="mo-sao">' + '⭐'.repeat(3 - sao) + '</span>'
        : 'Chưa làm';
      card.innerHTML =
        '<div class="dau-the"><div class="emoji">' + bai.emoji + '</div>' +
        '<div><h2>' + bai.ten + '</h2><p>' + bai.mo_ta + '</p></div></div>' +
        '<div class="thanh-the"><i style="width:' + phanTram + '%"></i></div>' +
        '<div class="duoi-the"><span>' + nhan + '</span><b>' + phanTram + '%</b></div>' + huy;
      return card;
    }

    card.innerHTML =
      '<div class="emoji">' + bai.emoji + '</div>' +
      '<h2>' + bai.ten + '</h2>' +
      '<p>' + bai.mo_ta + '</p>' + huy;
    return card;
  }

  function veNhom(ten, kieu, ds, noiBat) {
    var tieu = document.createElement('h2');
    tieu.className = 'nhom';
    tieu.textContent = ten;
    goc.appendChild(tieu);

    var luoi = document.createElement('div');
    luoi.className = 'grid ' + kieu;
    ds.forEach(function (b) { luoi.appendChild(taoThe(b, noiBat, kieu)); });
    goc.appendChild(luoi);
  }

  veNhom('Trò chơi', 'kieu-keo', TRO_CHOI, true);
  veNhom('Bài kiểm tra và nâng cao', 'kieu-tien-do', KIEM_TRA, true);
  NHOM.forEach(function (nhom) { veNhom(nhom.ten, nhom.kieu, nhom.bai, false); });

  if (tongSao > 0) {
    document.getElementById('loi-chao').innerHTML =
      'Bé đã sưu tầm được <b>' + tongSao + ' ⭐</b> — cố lên nào!';
  }
</script>
</body>
</html>
