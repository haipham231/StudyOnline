<script>
  var T = ToanL2;
  function mix() {
    var ds = Array.prototype.slice.call(arguments);
    return function () { return Quiz.pick(ds)(); };
  }

  GameCauCa.batDau('game', {
    khoa: 'studyonline:game-cau-ca-l2',
    ho: [
    { id: 'ao', ten: 'Ao Nhỏ', mucDo: 'Dễ', emoji: '🪣', mau: '#2fcf90', nen: '#e4f9f0',
      dan: ['cau-ca/ca-nho', 'cau-ca/cua'], coCa: 48,
      mota: 'Cộng trừ trong 100, bảng nhân 2 và 5',
      de: mix(function () { return T.congTru100(false); }, function () { return T.nhanBang(2); }, function () { return T.chiaBang(2); }, T.cauTaoSo) },

    { id: 'song', ten: 'Sông Lớn', mucDo: 'Vừa', emoji: '🏞️', mau: '#4aa8ff', nen: '#e3f1ff',
      dan: ['cau-ca/ca-vua', 'cau-ca/bach-tuoc', 'cau-ca/cua'], coCa: 66,
      mota: 'Cộng trừ có nhớ, bảng nhân 5, xem giờ',
      de: mix(function () { return T.congTru100(true); }, function () { return T.nhanBang(5); }, T.xemGio2, T.soSanh3CS, T.tenThanhPhan) },

    { id: 'bien', ten: 'Biển Sâu', mucDo: 'Khó', emoji: '🌊', mau: '#6a58e0', nen: '#ece8ff',
      dan: ['cau-ca/ca-map', 'cau-ca/ca-voi', 'cau-ca/sua', 'cau-ca/bach-tuoc'], coCa: 80,
      mota: 'Phạm vi 1000, tìm x, toán đố',
      de: mix(T.congTru1000, T.timX, T.duongGapKhuc, T.doNhieuHon, T.doGapSoLan, T.doChiaDeu) }
    ]
  });
</script>
