<script type="module" src="https://cdn.jsdelivr.net/npm/@lottiefiles/dotlottie-wc@0.6.2/dist/dotlottie-wc.js"></script>
<script>
  var T = ToanL2;

  // Lớp trên không học Tiếng Việt ở đây nên hai mạch xen kẽ là Tính và Đố
  GameHalloween.batDau('game', {
    khoa: 'studyonline:game-halloween-l2',
    mon: ['Tính', 'Đố'],
    ai: [
    { ten: 'Cổng Bí Ngô', hinh: 'bi-ngo', quai: 'bi-ngo', nen: 'vuon-bi-ngo', hop: 'thung', emoji: '🎃', mau: '#ff8f3c', soCau: 6,
      mota: 'Cộng trừ trong 100 · tên gọi thành phần',
      toan: function () { return T.congTru100(false); },
      tviet: T.tenThanhPhan },

    { ten: 'Lối Mòn Ma Trơi', hinh: 'ma', quai: 'xac-uop', nen: 'rung-suong', hop: 'bia-mo', emoji: '👻', mau: '#8b7bf7', soCau: 6,
      mota: 'Bảng nhân chia · tìm x',
      toan: function () { return Quiz.pick([T.nhanBang, T.chiaBang])(); },
      tviet: T.timX },

    { ten: 'Rừng Dơi Đen', hinh: 'canh/doi', quai: 'nguoi-soi', nen: 'nghia-dia', hop: 'ruong', emoji: '🦇', mau: '#4b3bb0', soCau: 6,
      mota: 'Cộng trừ có nhớ · số có ba chữ số',
      toan: function () { return T.congTru100(true); },
      tviet: function () { return Quiz.pick([T.cauTaoSo, T.soSanh3CS])(); } },

    { ten: 'Nghĩa Địa Mèo Đen', hinh: 'meo-phu-thuy', quai: 'nhen', nen: 'gac-mai', hop: 'bi-ngo', emoji: '🐈‍⬛', mau: '#2b2f55', soCau: 7,
      mota: 'Phạm vi 1000 · đo lường',
      toan: T.congTru1000,
      tviet: function () { return Quiz.pick([T.doDoDai2, T.canNang])(); } },

    { ten: 'Lâu Đài Phù Thuỷ', hinh: 'phu-thuy', quai: 'phu-thuy', nen: 'dam-lay', hop: 'thung', emoji: '🧙', mau: '#6a58e0', soCau: 7, trum: true,
      mota: 'Trộn tất cả · toán đố',
      toan: function () { return Quiz.pick([T.congTru1000, T.nhanBang, T.chiaBang, T.timX])(); },
      tviet: function () { return Quiz.pick([T.doNhieuHon, T.doGapSoLan, T.doChiaDeu, T.duongGapKhuc])(); } }
    ]
  });
</script>
