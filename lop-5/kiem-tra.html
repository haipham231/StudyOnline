<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bài kiểm tra — Toán lớp 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

</head>
<body>
<header class="topbar">
  <a class="back" href="index.html">← Trang chủ</a>
  <h1>📝 Bài kiểm tra</h1>
</header>

<main id="quiz" class="quiz"></main>

<script src="../js/o-tra-loi.js"></script>
<script src="../js/quiz.js"></script>
<script src="../js/tro-ly.js"></script>
<script src="../js/toan-lop-5.js"></script>
<script>
  var T = ToanL5;

  /* Ma trận đề — bám phạm vi kiến thức tới từng mốc của năm học lớp 5 */
  var MA_TRAN = {
    'giua-ki-1': [
      [3, T.rutGon], [2, T.quyDongMauSo], [3, T.congTruPhanSo], [2, T.nhanChiaPhanSo],
      [2, T.soSanhPhanSo], [2, T.honSo], [2, T.phanSoSangThapPhan],
      [2, T.soSanhThapPhan], [2, T.doiDonVi]
    ],
    'cuoi-ki-1': [
      [3, T.congTruThapPhan], [3, T.nhanHaiThapPhan], [2, T.chiaThapPhanChoThapPhan],
      [2, T.lamTron], [2, T.giaTriPhanTram], [2, T.tiSoPhanTram],
      [2, T.dienTichTamGiac], [2, T.dienTichHinhThang], [2, T.doiDonVi]
    ],
    'cuoi-nam': [
      [2, T.congTruThapPhan], [2, T.nhanHaiThapPhan], [2, T.timX],
      [2, T.giaTriPhanTram], [2, T.hinhTron], [2, T.theTich],
      [2, T.dienTichXungQuanh], [2, T.tinhNguocTamGiac], [2, T.thoiGian],
      [2, T.chuyenDong], [2, T.trungBinhCong]
    ]
  };

  function taoDe(ten) {
    var de = [];
    var daCo = {};
    MA_TRAN[ten].forEach(function (dong) {
      var soCau = dong[0], sinh = dong[1];
      for (var i = 0; i < soCau; i++) {
        var q, khoa, lan = 0;
        do {
          q = sinh();
          khoa = (q.prompt || '') + (q.text || '') + (q.after || '') + q.answer;
          lan++;
        } while (daCo[khoa] && lan < 30);
        daCo[khoa] = true;
        de.push(q);
      }
    });
    return Quiz.shuffle(de);
  }

  function demCau(ten) {
    return MA_TRAN[ten].reduce(function (t, d) { return t + d[0]; }, 0);
  }

  Quiz.init({
    id: 'l5-kiem-tra',
    exam: true,
    troLy: true,
    levels: [
      { name: 'Đề giữa học kì 1',
        hint: demCau('giua-ki-1') + ' câu · phân số và số thập phân',
        taoDe: function () { return taoDe('giua-ki-1'); } },
      { name: 'Đề cuối học kì 1',
        hint: demCau('cuoi-ki-1') + ' câu · bốn phép tính thập phân, phần trăm, diện tích',
        taoDe: function () { return taoDe('cuoi-ki-1'); } },
      { name: 'Đề cuối năm học',
        hint: demCau('cuoi-nam') + ' câu · toàn bộ chương trình, có hình tròn và chuyển động',
        taoDe: function () { return taoDe('cuoi-nam'); } }
    ]
  });
</script>
</body>
</html>
