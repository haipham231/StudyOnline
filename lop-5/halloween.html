<footer class="ghi-cong">

<script type="module" src="https://cdn.jsdelivr.net/npm/@lottiefiles/dotlottie-wc@0.6.2/dist/dotlottie-wc.js"></script>
<script>
  var T = ToanL5;
  function mix() {
    var ds = Array.prototype.slice.call(arguments);
    // giữ lại danh sách để MucDo bớt dạng khi chơi mức Dễ
    var f = function () { return Quiz.pick(ds)(); };
    f.ds = ds;
    return f;
  }

  // Lớp trên không học Tiếng Việt ở đây nên hai mạch xen kẽ là Tính và Đố
  GameHalloween.batDau('game', {
    khoa: 'studyonline:game-halloween-l5',
    mon: ['Tính', 'Đố'],
    ai: [
    { ten: 'Cổng Bí Ngô', hinh: 'bi-ngo', quai: 'bi-ngo', nen: 'vuon-bi-ngo', hop: 'bi-ngo', emoji: '🎃', mau: '#ff8f3c', soCau: 6,
      mota: 'Phân số · trung bình cộng',
      toan: mix(T.rutGon, T.quyDongMauSo, T.soSanhPhanSo),
      tviet: T.trungBinhCong },

    { ten: 'Lối Mòn Ma Trơi', hinh: 'ma', quai: 'xac-uop', nen: 'rung-suong', hop: 'thung', emoji: '👻', mau: '#8b7bf7', soCau: 6,
      mota: 'Bốn phép tính phân số · bài toán tỉ lệ',
      toan: mix(T.congTruPhanSo, T.nhanChiaPhanSo, T.tinhHonHopPhanSo, T.honSo),
      tviet: T.tiLeThuan },

    { ten: 'Rừng Dơi Đen', hinh: 'canh/doi', quai: 'nhen', nen: 'nghia-dia', hop: 'bia-mo', emoji: '🦇', mau: '#4b3bb0', soCau: 6,
      mota: 'Số thập phân · chuyển động đều',
      toan: mix(T.congTruThapPhan, T.nhanHaiThapPhan, T.chiaThapPhanChoThapPhan, T.lamTron),
      tviet: T.chuyenDong },

    { ten: 'Nghĩa Địa Mèo Đen', hinh: 'meo-phu-thuy', quai: 'frankenstein', nen: 'gac-mai', hop: 'ruong', emoji: '🐈‍⬛', mau: '#2b2f55', soCau: 7,
      mota: 'Tỉ số phần trăm · toán đố phần trăm',
      toan: mix(T.giaTriPhanTram, T.tiSoPhanTram, T.timSoBanDau),
      tviet: mix(T.phanTramThucTe, T.tongTi) },

    { ten: 'Lâu Đài Phù Thuỷ', hinh: 'phu-thuy', quai: 'phu-thuy', nen: 'dam-lay', hop: 'bi-ngo', emoji: '🧙', mau: '#6a58e0', soCau: 7, trum: true,
      mota: 'Hình học và đo lường · bài toán tính ngược',
      toan: mix(T.dienTichTamGiac, T.dienTichHinhThang, T.hinhTron, T.theTich,
        T.doiDonVi, T.thoiGian),
      tviet: mix(T.beNuoc, T.tinhNguocTamGiac, T.tinhNguocHinhThang, T.banKinhTuChuVi,
        T.dienTichPhanToMau) }
    ]
  });
</script>
