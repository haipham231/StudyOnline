<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Học Lớp 1 — Toán và Tiếng Việt</title>
<meta name="description" content="Luyện toán lớp 1 theo chương trình GDPT 2018: số và phép tính, hình học và đo lường, giải toán có lời văn, kèm bộ đề kiểm tra.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>🧮</text></svg>">
</head>
<body>
<div class="wrap">

  <nav class="crumb"><a class="back" href="../index.html">← Chọn lứa tuổi</a></nav>

  <header class="hero">
    <div class="mascot">🦊</div>
    <h1>Học Lớp 1</h1>
    <p id="loi-chao">Chọn một bài để bắt đầu nhé!</p>
  </header>

  <main id="noi-dung"></main>

  <footer>
    <p>Bám chương trình Toán 1 và Tiếng Việt 1 (GDPT 2018) · Đề sinh ngẫu nhiên mỗi lần chơi.</p>
  </footer>

</div>

<script src="../js/o-tra-loi.js"></script>
<script src="../js/quiz.js"></script>
<script src="../js/danh-hieu.js"></script>
<script>
  var GAME = {
    id: 'game-cong-chua', emoji: '🗡️', mau: '#ff8fd0', ten: 'Giải cứu công chúa',
    mo_ta: 'Rồng bắt mất công chúa rồi! Vượt 6 chặng, giải đúng bài toán để tiến bước và đánh bại rồng.',
    href: 'cuu-cong-chua.html'
  };

  var GAME_HALLOWEEN = {
    id: 'game-halloween', emoji: '🎃', mau: '#ff8f3c', ten: 'Đêm Halloween',
    mo_ta: 'Phù thuỷ giấu hết kẹo! Vượt 6 ải, xen kẽ một câu Toán và một câu Tiếng Việt để đòi lại kẹo.',
    href: 'halloween.html'
  };

  var GAME_CAU_CA = {
    id: 'game-cau-ca', emoji: '🎣', mau: '#4aa8ff', ten: 'Câu cá cùng bé',
    mo_ta: 'Chọn hồ dễ, vừa hay khó rồi trả lời 10 câu Toán và Tiếng Việt. Đúng thì câu được cá bỏ vào xô!',
    href: 'cau-ca.html'
  };

  var KIEM_TRA = {
    id: 'kiem-tra', emoji: '📝', mau: '#8b7bf7', ten: 'Bài kiểm tra',
    mo_ta: 'Ba bộ đề theo giữa kì 1, cuối kì 1 và cuối năm. Máy chấm điểm thang 10 và chỉ ra bé còn yếu phần nào.',
    href: 'kiem-tra.html'
  };

  var NHOM = [
    { ten: 'Số và phép tính', kieu: 'kieu-sticker', bai: [
      { id: 'cong-tru',    emoji: '➕', mau: '#4aa8ff', ten: 'Cộng trừ',
        mo_ta: 'Phạm vi 10, 20 và 100.' },
      { id: 'tach-gop',    emoji: '🧱', mau: '#ff8fd0', ten: 'Tách gộp số',
        mo_ta: 'Số 7 gồm 3 và mấy?' },
      { id: 'chuc-don-vi', emoji: '🔟', mau: '#2fcf90', ten: 'Chục và đơn vị',
        mo_ta: 'Cấu tạo số có hai chữ số.' },
      { id: 'tinh-day',    emoji: '🧮', mau: '#ffc93c', ten: 'Tính dãy',
        mo_ta: 'Hai phép tính liền nhau: 3 + 2 + 4.' },
      { id: 'dien-so',     emoji: '🧩', mau: '#8b7bf7', ten: 'Điền số còn thiếu',
        mo_ta: 'Ví dụ: 3 + ? = 7' },
      { id: 'so-sanh',     emoji: '⚖️', mau: '#2fcf90', ten: 'So sánh số',
        mo_ta: 'Điền dấu lớn hơn, bé hơn hoặc bằng.' },
      { id: 'lon-be',      emoji: '🥇', mau: '#ff7a7a', ten: 'Lớn nhất, bé nhất',
        mo_ta: 'Tìm số lớn nhất hoặc bé nhất.' },
      { id: 'dem-day-so',  emoji: '🔢', mau: '#ffc93c', ten: 'Đếm và dãy số',
        mo_ta: 'Đếm hình, số liền trước liền sau, dãy số.' }
    ] },
    { ten: 'Hình học và đo lường', kieu: 'kieu-sticker', bai: [
      { id: 'hinh-hoc',   emoji: '🔷', mau: '#4aa8ff', ten: 'Nhận biết hình',
        mo_ta: 'Hình vuông, tròn, tam giác, chữ nhật.' },
      { id: 'hinh-khoi',  emoji: '🧊', mau: '#8b7bf7', ten: 'Hình khối',
        mo_ta: 'Khối lập phương, hộp chữ nhật, trụ, cầu.' },
      { id: 'do-do-dai',  emoji: '📏', mau: '#2fcf90', ten: 'Đo độ dài',
        mo_ta: 'Nhìn thước và đọc số đo xăng-ti-mét.' },
      { id: 'xem-gio',    emoji: '🕐', mau: '#ff7a7a', ten: 'Xem giờ',
        mo_ta: 'Giờ đúng và giờ rưỡi trên đồng hồ kim.' }
    ] },
    { ten: 'Giải toán có lời văn', kieu: 'kieu-sticker', bai: [
      { id: 'toan-do', emoji: '📖', mau: '#ff8fd0', ten: 'Toán đố',
        mo_ta: 'Thêm, bớt, nhiều hơn, ít hơn, tìm số lúc đầu.' }
    ] },
    { ten: 'Tiếng Việt', tv: true, kieu: 'kieu-hinh', bai: [
      { id: 'chu-cai',    emoji: '🔤', mau: '#4aa8ff', ten: 'Chữ cái', mo_ta: 'Chữ hoa, chữ thường, âm đầu.' },
      { id: 'ghep-van',   emoji: '🧩', mau: '#8b7bf7', ten: 'Ghép vần', mo_ta: 'Âm đầu + vần + thanh thành tiếng.' },
      { id: 'thanh-dieu', emoji: '🎵', mau: '#ffc93c', ten: 'Thanh điệu', mo_ta: 'Ngang, huyền, sắc, hỏi, ngã, nặng.' },
      { id: 'quy-tac',    emoji: '📏', mau: '#2fcf90', ten: 'Quy tắc chính tả', mo_ta: 'c/k, g/gh, ng/ngh.' },
      { id: 'chinh-ta',   emoji: '✍️', mau: '#ff7a7a', ten: 'Chính tả dễ lẫn', mo_ta: 's/x, ch/tr, l/n, d/gi/r, hỏi/ngã.' },
      { id: 'tu-ngu',     emoji: '🏷️', mau: '#ff8fd0', ten: 'Từ ngữ', mo_ta: 'Từ loại và từ trái nghĩa.' },
      { id: 'cau',        emoji: '📝', mau: '#4aa8ff', ten: 'Câu', mo_ta: 'Sắp xếp câu, dấu câu, đếm tiếng.' },
      { id: 'doc-hieu',   emoji: '📖', mau: '#8b7bf7', ten: 'Đọc hiểu', mo_ta: 'Đọc đoạn ngắn rồi trả lời.' }
    ] }
  ];

  var goc = document.getElementById('noi-dung');
  var tongSao = 0;

  function taoThe(bai, noiBat, laTiengViet, kieu) {
    var best = Quiz.readBest(laTiengViet ? 'tv-' + bai.id : bai.id);
    var sao = best ? Quiz.starsFor(best.correct, best.total) : 0;
    if (!noiBat) tongSao += sao;

    var card = document.createElement('a');
    card.className = 'card';
    card.href = bai.href || ((laTiengViet ? 'tieng-viet/' : 'bai-tap/') + bai.id + '.html');
    card.style.setProperty('--tint', bai.mau);

    var huy = '', ptDe = null;
    if (bai.id === 'game-cau-ca') {
      var tc = null;
      try { tc = JSON.parse(localStorage.getItem('studyonline:game-cau-ca') || 'null'); } catch (e) {}
      if (tc && tc.tongCa) huy = '<span class="best">🐟 Đã câu được ' + tc.tongCa + ' con cá</span>';
    } else if (bai.id === 'game-cong-chua' || bai.id === 'game-halloween') {
      var tt = null;
      try { tt = JSON.parse(localStorage.getItem('studyonline:' + bai.id) || 'null'); } catch (e) {}
      if (tt) {
        var sao = 0;
        Object.keys(tt.sao || {}).forEach(function (k) { sao += tt.sao[k]; });
        var xong = bai.id === 'game-halloween'
          ? (tt.thang ? '👑 Vua Halloween · 🍬 ' + (tt.keo || 0) + ' · ' : 'Đang ở ải ' + tt.mo + ' · 🍬 ' + (tt.keo || 0) + ' · ')
          : (tt.daCuu ? '👑 Đã cứu được công chúa · ' : 'Đang ở chặng ' + tt.mo + ' · ');
        huy = '<span class="best">' + xong + sao + '/18 ⭐</span>';
      }
    } else if (bai.id === 'kiem-tra') {
      var ds = Quiz.readLichSu('kiem-tra');
      if (ds.length) {
        huy = '<span class="best">Lần gần nhất: ' + ds[0].diem + '/10 — ' + ds[0].de + '</span>';
        ptDe = ds[0].diem * 10;
      }
    } else if (best) {
      huy = '<span class="best">' + '⭐'.repeat(sao) + ' ' + best.score + ' điểm</span>';
    }

    // Kiểu bảng tiến độ cần thêm thanh phần trăm và hàng chân; ba kiểu còn
    // lại dùng chung một thân thẻ.
    if (kieu === 'kieu-tien-do') {
      var phanTram = ptDe != null ? ptDe : (best ? Math.round(best.correct / best.total * 100) : 0);
      var nhan = best || ptDe != null
        ? '⭐'.repeat(sao) + '<span class="mo-sao">' + '⭐'.repeat(3 - sao) + '</span>'
        : 'Chưa làm';
      card.innerHTML =
        '<div class="dau-the"><div class="emoji">' + bai.emoji + '</div>' +
        '<div><h2>' + bai.ten + '</h2><p>' + bai.mo_ta + '</p></div></div>' +
        '<div class="thanh-the"><i style="width:' + phanTram + '%"></i></div>' +
        '<div class="duoi-the"><span>' + nhan + '</span><b>' + phanTram + '%</b></div>' + huy;
      return card;
    }

    card.innerHTML =
      '<div class="emoji">' + bai.emoji + '</div>' +
      '<h2>' + bai.ten + '</h2>' +
      '<p>' + bai.mo_ta + '</p>' + huy;
    return card;
  }

  // Trò chơi và bài kiểm tra tách thành hai nhóm vì mỗi bên một kiểu thẻ:
  // chơi thì kẹo ngọt, thi thì bảng tiến độ có phần trăm.
  function veNhom(ten, kieu, ds, noiBat, tv) {
    var tieu = document.createElement('h2');
    tieu.className = 'nhom';
    tieu.textContent = ten;
    goc.appendChild(tieu);

    var luoi = document.createElement('div');
    luoi.className = 'grid ' + kieu;
    ds.forEach(function (b) { luoi.appendChild(taoThe(b, noiBat, tv, kieu)); });
    goc.appendChild(luoi);
  }

  veNhom('Trò chơi', 'kieu-keo', [GAME_CAU_CA, GAME_HALLOWEEN, GAME], true, false);
  veNhom('Bài kiểm tra', 'kieu-tien-do', [KIEM_TRA], true, false);

  NHOM.forEach(function (nhom) {
    veNhom(nhom.ten, nhom.kieu, nhom.bai, false, nhom.tv);
  });

  if (tongSao > 0) {
    document.getElementById('loi-chao').innerHTML =
      'Bé đã sưu tầm được <b>' + tongSao + ' ⭐</b> — cố lên nào!';
  }

  // dải danh hiệu ở cuối trang
  if (window.DanhHieu) {
    var dai = document.createElement('div');
    dai.innerHTML = DanhHieu.veDai('lop-1');
    (document.getElementById('noi-dung') || document.getElementById('list').parentNode)
      .appendChild(dai);
    DanhHieu.baoMoiDat();
  }
</script>
</body>
</html>
