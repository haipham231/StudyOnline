<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bài kiểm tra — Toán lớp 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>📝</text></svg>">
</head>
<body>
<header class="topbar">
  <a class="back" href="index.html">← Trang chủ</a>
  <h1>📝 Bài kiểm tra</h1>
</header>

<main id="quiz" class="quiz"></main>

<script src="../js/o-tra-loi.js"></script>
<script src="../js/quiz.js"></script>
<script src="../js/toan-lop-1.js"></script>
<script>
  var T = ToanL1;

  /* Ma trận đề — mỗi dòng là [số câu, hàm sinh đề].
     Chia theo ba mốc của năm học, bám phạm vi số mà sách giáo khoa dạy tới thời điểm đó. */

  var MA_TRAN = {
    'giua-ki-1': [
      [3, function () { return T.demHinh(10); }],
      [2, function () { return T.lienKe(10); }],
      [3, function () { return T.soSanh(10); }],
      [4, function () { return T.congTru(10, true); }],
      [3, function () { return T.tachGop(10); }],
      [2, function () { return T.dienSo(10); }],
      [2, T.nhanBietHinh],
      [1, function () { return T.lonNhatBeNhat(10); }]
    ],
    'cuoi-ki-1': [
      [3, function () { return T.congTru(10, false); }],
      [4, function () { return T.congTru(20, false); }],
      [3, function () { return T.tachGop(10); }],
      [3, function () { return T.dienSo(20); }],
      [2, function () { return T.soSanh(20); }],
      [2, function () { return T.tinhDay(10); }],
      [2, T.nhanBietHinh],
      [1, T.hinhKhoi]
    ],
    'cuoi-nam': [
      [3, T.chucDonVi],
      [3, T.congTruKhongNho],
      [2, function () { return T.congTru(20, false); }],
      [2, function () { return T.dienSoTronChuc(); }],
      [2, function () { return T.soSanh(100); }],
      [2, function () { return T.daySo(Quiz.pick([2, 5, 10]), 100); }],
      [3, function () { return Quiz.pick([T.choThem, T.choDi, T.gopNhom, T.nhieuHon, T.itHon])(20, false); }],
      [1, function () { return T.xemGio(true); }],
      [1, T.doDoDai],
      [1, T.hinhKhoi]
    ]
  };

  // Dựng đề: sinh đủ số câu mỗi phần, loại đề trùng nhau, rồi xáo trộn thứ tự
  function taoDe(ten) {
    var de = [];
    var daCo = {};                       // chung cho cả đề, không riêng từng phần
    MA_TRAN[ten].forEach(function (dong) {
      var soCau = dong[0], sinh = dong[1];
      for (var i = 0; i < soCau; i++) {
        var q, khoa, lan = 0;
        do {
          q = sinh();
          khoa = (q.prompt || '') + (q.text || '') + (q.after || '') + q.answer;
          lan++;
        } while (daCo[khoa] && lan < 25);
        daCo[khoa] = true;
        de.push(q);
      }
    });
    return Quiz.shuffle(de);
  }

  function demCau(ten) {
    return MA_TRAN[ten].reduce(function (t, d) { return t + d[0]; }, 0);
  }

  Quiz.init({
    id: 'kiem-tra',
    exam: true,
    levels: [
      { name: 'Đề giữa học kì 1',
        hint: demCau('giua-ki-1') + ' câu · các số đến 10',
        taoDe: function () { return taoDe('giua-ki-1'); } },
      { name: 'Đề cuối học kì 1',
        hint: demCau('cuoi-ki-1') + ' câu · các số đến 20',
        taoDe: function () { return taoDe('cuoi-ki-1'); } },
      { name: 'Đề cuối năm học',
        hint: demCau('cuoi-nam') + ' câu · các số đến 100, có toán đố và đo lường',
        taoDe: function () { return taoDe('cuoi-nam'); } }
    ]
  });
</script>
</body>
</html>
