<script src="../../js/o-tra-loi.js"></script>
<script src="../../js/quiz.js"></script>
<script src="../../js/toan-lop-1.js"></script>
<script>
  var T = ToanL1;

  Quiz.init({
    id: 'dem-day-so',
    total: 10,
    levels: [
      { name: 'Đếm hình', hint: 'Đếm số lượng trong tranh',
        gen: function () { return T.demHinh(10); } },
      { name: 'Số liền trước, liền sau', hint: 'Các số đến 100',
        gen: function () { return T.lienKe(100); } },
      { name: 'Dãy số', hint: 'Đếm thêm 1, 2, 5 hoặc 10',
        gen: function () { return T.daySo(Quiz.pick([1, 2, 5, 10]), 100); } }
    ]
  });
</script>
