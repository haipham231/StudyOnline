<script>
  var T = ToanL1;

  Quiz.init({
    id: 'toan-do',
    total: 8,
    levels: [
      { name: 'Phạm vi 10', hint: 'Thêm vào, bớt đi, gộp lại — có hình minh hoạ',
        gen: function () { return Quiz.pick([T.choThem, T.choDi, T.gopNhom])(10, true); } },
      { name: 'Phạm vi 20', hint: 'Thêm cả dạng nhiều hơn, ít hơn',
        gen: function () {
          return Quiz.pick([T.choThem, T.choDi, T.gopNhom, T.nhieuHon, T.itHon, T.roiKhoi])(20, false);
        } },
      { name: 'Thử thách', hint: 'Tìm số lúc đầu, hơn kém bao nhiêu',
        gen: function () {
          return Quiz.pick([T.lucDau, T.honKem, T.nhieuHon, T.itHon, T.roiKhoi])(20);
        } }
    ]
  });
</script>
