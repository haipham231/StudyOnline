<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>So sánh số — Học Toán Lớp 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>⚖️</text></svg>">
</head>
<body>
<header class="topbar">
  <a class="back" href="../index.html">← Trang chủ</a>
  <h1>⚖️ So sánh số</h1>
</header>

<main id="quiz" class="quiz"></main>

<script src="../js/quiz.js"></script>
<script>
  var r = Quiz.randInt;
  var DAU = ['>', '<', '='];

  function dau(x, y) { return x > y ? '>' : x < y ? '<' : '='; }

  function soSanhSo(max) {
    var a = r(1, max);
    var b = Math.random() < 0.25 ? a : r(1, max);   // chừa phần cho đáp án "="
    return { text: String(a), after: String(b), answer: dau(a, b), choices: DAU };
  }

  function soSanhPhepTinh() {
    var a = r(1, 9), b = r(1, 10 - a);
    var c = r(1, 9), d = r(1, 10 - c);
    if (Math.random() < 0.25) { c = a; d = b; }
    return {
      prompt: 'Tính hai vế rồi điền dấu thích hợp nhé!',
      text: a + ' + ' + b,
      after: c + ' + ' + d,
      answer: dau(a + b, c + d),
      choices: DAU,
      small: true
    };
  }

  Quiz.init({
    id: 'so-sanh',
    total: 10,
    levels: [
      { name: 'Các số đến 10', gen: function () { return soSanhSo(10); } },
      { name: 'Các số đến 100', gen: function () { return soSanhSo(100); } },
      { name: 'So sánh phép tính', hint: 'Ví dụ: 3 + 4 … 2 + 6', gen: soSanhPhepTinh }
    ]
  });
</script>
</body>
</html>
