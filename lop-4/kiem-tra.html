<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bài kiểm tra — Toán lớp 4</title>
<meta name="description" content="Ba bộ đề kiểm tra Toán lớp 4: giữa kì 1, cuối kì 1 và cuối năm. Máy chấm điểm thang 10.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>📝</text></svg>">
</head>
<body>
<header class="topbar">
  <a class="back" href="index.html">← Quay lại</a>
  <h1>📝 Bài kiểm tra Toán lớp 4</h1>
</header>

<main id="quiz" class="quiz"></main>

<script src="../js/o-tra-loi.js"></script>
<script src="../js/quiz.js"></script>
<script src="../js/tro-ly.js"></script>
<script src="../js/toan-lop-4.js"></script>
<script>
  var T = ToanL4;

  /* Ma trận đề — mỗi dòng là [số câu, hàm sinh đề], bám ba mốc của năm học. */
  var MA_TRAN = {
    'giua-ki-1': [
      [3, T.hangCuaChuSo],
      [3, T.giaTriChuSo],
      [3, T.lamTronL4],
      [3, T.congTruLonL4],
      [2, T.dauHieuChiaHet],
      [2, T.trungBinhCong],
      [3, function () { return Quiz.pick([T.doTrungBinh, T.doMuaHang])(); }]
    ],
    'cuoi-ki-1': [
      [3, T.nhanHaiChuSo],
      [3, T.chiaHaiChuSo],
      [2, T.tinhNhanhL4],
      [3, T.dauHieuChiaHet],
      [2, T.nhanBietGoc],
      [2, T.doiDonViL4],
      [2, T.trungBinhCong],
      [2, T.doTongHieu]
    ],
    'cuoi-nam': [
      [2, T.rutGonPS],
      [2, T.soSanhPS],
      [2, T.congPSCungMau],
      [2, T.phanSoCuaSoL4],
      [2, T.tongHieu],
      [2, T.tongTi],
      [2, T.dienTichBinhHanh],
      [2, T.dienTichHinhThoi],
      [2, T.doiDonViL4],
      [3, function () { return Quiz.pick([T.doTongHieu, T.doMuaHang, T.doDienTichDat])(); }]
    ],
    'luyen-1': [
      [3, T.hangCuaChuSo],
      [3, T.nhanHaiChuSo],
      [3, T.chiaHaiChuSo],
      [3, T.dauHieuChiaHet],
      [3, T.trungBinhCong],
      [2, T.lamTronL4],
      [4, function () { return Quiz.pick([T.doTrungBinh, T.doMuaHang])(); }]
    ],
    'luyen-2': [
      [3, T.rutGonPS],
      [3, T.soSanhPS],
      [3, T.congPSCungMau],
      [3, T.phanSoCuaSoL4],
      [3, T.tongHieu],
      [3, T.tongTi],
      [3, T.doTongHieu]
    ],
    'luyen-3': [
      [3, T.dienTichBinhHanh],
      [3, T.dienTichHinhThoi],
      [3, T.chuViDienTichL4],
      [3, T.doiDonViL4],
      [2, T.nhanBietGoc],
      [2, T.tinhNhanhL4],
      [4, function () { return Quiz.pick([T.doDienTichDat, T.doMuaHang])(); }]
    ]
  };

  // Dựng đề: sinh đủ số câu mỗi phần, loại đề trùng nhau, rồi xáo trộn thứ tự
  function taoDe(ten) {
    var de = [];
    var daCo = {};
    MA_TRAN[ten].forEach(function (dong) {
      var soCau = dong[0], sinh = dong[1];
      for (var i = 0; i < soCau; i++) {
        var q, khoa, lan = 0;
        do {
          q = sinh();
          khoa = (q.prompt || '') + (q.text || '') + (q.after || '') + q.answer;
          lan++;
        } while (daCo[khoa] && lan < 25);
        daCo[khoa] = true;
        de.push(q);
      }
    });
    return Quiz.shuffle(de);
  }

  function demCau(ten) {
    return MA_TRAN[ten].reduce(function (t, d) { return t + d[0]; }, 0);
  }

  Quiz.init({
    id: 'l4-kiem-tra',
    exam: true,
    troLy: true,
    levels: [
      { name: 'Đề giữa học kì 1',
        hint: demCau('giua-ki-1') + ' câu · số tự nhiên, làm tròn, trung bình cộng',
        taoDe: function () { return taoDe('giua-ki-1'); } },
      { name: 'Đề cuối học kì 1',
        hint: demCau('cuoi-ki-1') + ' câu · nhân chia số lớn, chia hết, góc',
        taoDe: function () { return taoDe('cuoi-ki-1'); } },
      { name: 'Đề cuối năm học',
        hint: demCau('cuoi-nam') + ' câu · cả năm — phân số, tổng hiệu tổng tỉ, hình học',
        taoDe: function () { return taoDe('cuoi-nam'); } },
      { name: 'Đề luyện tập 1',
        hint: demCau('luyen-1') + ' câu · trộn cả năm, nhấn số và phép tính',
        taoDe: function () { return taoDe('luyen-1'); } },
      { name: 'Đề luyện tập 2',
        hint: demCau('luyen-2') + ' câu · trộn cả năm, nhấn phân số và dạng toán điển hình',
        taoDe: function () { return taoDe('luyen-2'); } },
      { name: 'Đề luyện tập 3',
        hint: demCau('luyen-3') + ' câu · trộn cả năm, nhấn hình học và đo lường',
        taoDe: function () { return taoDe('luyen-3'); } }
    ]
  });
</script>
</body>
</html>
